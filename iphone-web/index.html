<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Clipboard" />
  <title>Clipboard Sync</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTkyIiBoZWlnaHQ9IjE5MiIgdmlld0JveD0iMCAwIDE5MiAxOTIiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIxOTIiIGhlaWdodD0iMTkyIiBmaWxsPSIjMGYxNzJhIiByeD0iMzIiLz4KPHBhdGggZmlsbD0id2hpdGUiIGQ9Ik05NiAxMTMuNDNjLTguNDQgMC0xNS4yNyA2LjgzLTE1LjI3IDE5LjMxczYuODMgMTkuMzEgMTUuMjcgMTkuMzEgMTUuMjctNi44MyAxNS4yNy0xOS4zMS02LjgzLTE5LjMxLTE1LjI3LTE5LjMxek05NiAxMzYuNDJjLTYuNjMgMC0xMi01LjM3LTEyLTEyczUuMzctMTIgMTItMTIgMTIgNS4zNyAxMiAxMi01LjM3IDEyLTEyIDEyem0wLTIxLjY1Yy01LjM4IDAtOS44NiA0LjQ4LTkuODYgOS44NiAwIDUuMzggNC40OCA5Ljg2IDkuODYgOS44NiA1LjM4IDAgOS44Ni00LjQ4IDkuODYtOS44NiAwLTUuMzgtNC40OC05Ljg2LTkuODYtOS44NnoiLz4KPC9zdmc+">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: #0f172a; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; height: 100vh; }
    body { display: flex; flex-direction: column; }
    header { padding: 16px 20px; border-bottom: 1px solid #334155; background: #1e293b; text-align: center; }
    header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.5px; }
    header p { margin: 4px 0 0; font-size: 12px; color: #94a3b8; }
    main { flex: 1; overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 18px; }
    .label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; margin-bottom: 10px; display: block; }
    .input-wrap { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"] { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px 14px; color: #e2e8f0; font-size: 15px; outline: none; }
    input[type="text"]::placeholder { color: #64748b; }
    button { flex: 1; background: #3b82f6; border: none; color: #fff; border-radius: 10px; padding: 12px 16px; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:active { background: #2563eb; transform: scale(0.98); }
    button.secondary { background: #334155; }
    button.secondary:active { background: #475569; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .row { display: flex; gap: 10px; }
    .status { font-size: 13px; min-height: 20px; margin-top: 8px; }
    .status.ok { color: #4ade80; }
    .status.err { color: #f87171; }
    .devices { font-size: 12px; color: #64748b; margin-top: 6px; }
    .footer { padding: 16px 20px; font-size: 12px; color: #64748b; border-top: 1px solid #334155; text-align: center; }
    .hidden { display: none !important; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 10px 18px; border-radius: 8px; border: 1px solid #334155; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 50; }
    .toast.show { opacity: 1; }
    #clipboardDisplay { width: 100%; min-height: 140px; background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 14px; font-size: 16px; line-height: 1.5; color: #e2e8f0; resize: vertical; outline: none; }
    #clipboardDisplay::placeholder { color: #64748b; }
    .pc-bar { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 12px; color: #94a3b8; }
    .pc-bar b { color: #cbd5e1; }
  </style>
</head>
<body>
  <header>
    <h1>Clipboard Sync</h1>
    <p id="subTitle">iPhone &lt;-&gt; Windows PC</p>
  </header>

  <main>
    <!-- One-time PC setup -->
    <div id="setupScreen" class="card">
      <span class="label">Connect to Windows PC</span>
      <div class="input-wrap">
        <input type="text" id="pcIpInput" placeholder="e.g. 192.168.1.42" />
      </div>
      <div class="row">
        <button id="connectBtn">Connect</button>
        <button id="findPcBtn" class="secondary">Find my PC</button>
      </div>
      <div class="status" id="setupStatus"></div>
      <div style="font-size:12px;color:#64748b;margin-top:8px;">
        You only need to do this once. The iPhone will remember your PC.
      </div>
    </div>

    <!-- Main clipboard -->
    <div id="mainScreen" class="card hidden">
      <div class="pc-bar">
        <b id="pcAddress"></b>
        <button id="changePcBtn" class="secondary" style="padding:6px 10px;font-size:12px;">Change PC</button>
      </div>
      <span class="label">Shared Clipboard</span>
      <textarea id="clipboardDisplay" readonly placeholder="Clipboard content from your PC will appear here…"></textarea>
      <div class="row">
        <button id="copyBtn" class="secondary">Copy to iPhone</button>
        <button id="refreshBtn" class="secondary">Refresh</button>
      </div>

      <span class="label">Send to Windows PC</span>
      <div class="input-wrap">
        <input type="text" id="sendInput" placeholder="Type text to send to PC…" />
        <button id="sendBtn">Send</button>
      </div>

      <div class="status" id="status"></div>
      <div class="devices" id="devices">Devices: —</div>
    </div>
  </main>

  <div class="toast" id="toast"></div>
  <div class="footer">
    Keep the Windows client running on your PC.<br>
    <strong>Tip:</strong> Tap Share &rarr; Add to Home Screen to use it like a real app.
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
